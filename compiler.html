<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Compilador de marcador · MindAR</title>
  <style>
    body{font-family:system-ui,sans-serif;background:#F5F5FF;color:#3D3D3F;max-width:560px;margin:0 auto;padding:32px 16px}
    h1{color:#7652F5;font-size:24px} p{line-height:1.5}
    img{max-width:220px;border-radius:12px;display:block;margin:16px 0}
    button,label.btn{background:#7652F5;color:#fff;border:0;padding:12px 22px;border-radius:22px;font-size:16px;cursor:pointer;display:inline-block}
    progress{width:100%;height:14px;margin:16px 0}
    code{background:#E9E5FE;padding:2px 6px;border-radius:6px}
  </style>
</head>
<body>
  <h1>Compilar imagen objetivo (.mind)</h1>
  <p>Genera <code>targets.mind</code> a partir del retrato. Luego guárdalo en <code>assets/targets.mind</code> para que la experiencia AR cargue al instante.</p>
  <img id="preview" src="assets/ohiggins.jpg" alt="Imagen objetivo" />
  <p>
    <label class="btn">Cambiar imagen<input type="file" id="file" accept="image/*" hidden /></label>
    <button id="go">Compilar</button>
  </p>
  <progress id="prog" max="100" value="0"></progress>
  <p id="msg"></p>

<script type="module">
  // Compilador oficial de MindAR (el mismo que usa su herramienta online)
  import 'https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js';

  const embed = new URLSearchParams(location.search).has('embed');   // modo usado por ar.html
  const $ = id => document.getElementById(id);
  const post = msg => embed && parent.postMessage(msg, '*');

  const loadImg = src => new Promise((ok, ko) => {
    const i = new Image(); i.onload = () => ok(i); i.onerror = ko; i.src = src;
  });

  async function compile(){
    const img = await loadImg($('preview').src);
    const compiler = new window.MINDAR.IMAGE.Compiler();
    await compiler.compileImageTargets([img], p => {
      $('prog').value = p; $('msg').textContent = `Compilando… ${p.toFixed(0)}%`;
      post({type:'mind-progress', progress:p});
    });
    const u8 = await compiler.exportData();
    return u8.buffer.slice(u8.byteOffset, u8.byteOffset + u8.byteLength);
  }

  $('file').addEventListener('change', e => {
    const f = e.target.files[0]; if(f) $('preview').src = URL.createObjectURL(f);
  });

  $('go').addEventListener('click', async () => {
    $('go').disabled = true;
    try{
      const buf = await compile();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([buf]));
      a.download = 'targets.mind'; a.click();
      $('msg').textContent = '¡Listo! Mueve el archivo descargado a la carpeta assets/.';
    }catch(err){ $('msg').textContent = 'Error: ' + err.message; }
    $('go').disabled = false;
  });

  if(embed){
    compile().then(buf => parent.postMessage({type:'mind-done', buffer:buf}, '*', [buf]))
             .catch(err => post({type:'mind-error', message:String(err && err.message || err)}));
  }
</script>
</body>
</html>
